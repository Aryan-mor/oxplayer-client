name: Build OXPlayer

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.7"
  # App version: read from pubspec at runtime; build number comes from GitHub run number.
  OXPLAYER_VERSION_NAME: 0.10.3.${{ github.run_number }}

  # --- Runtime dart-defines (injected from GitHub Secrets / Variables) ---
  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || vars.TELEGRAM_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || vars.TELEGRAM_API_HASH }}
  BOT_USERNAME: ${{ secrets.BOT_USERNAME || vars.BOT_USERNAME }}
  OXPLAYER_API_BASE_URL: ${{ secrets.OXPLAYER_API_BASE_URL || vars.OXPLAYER_API_BASE_URL }}
  OXPLAYER_TELEGRAM_WEBAPP_SHORT_NAME: ${{ secrets.OXPLAYER_TELEGRAM_WEBAPP_SHORT_NAME || vars.OXPLAYER_TELEGRAM_WEBAPP_SHORT_NAME }}
  OXPLAYER_TELEGRAM_WEBAPP_URL: ${{ secrets.OXPLAYER_TELEGRAM_WEBAPP_URL || vars.OXPLAYER_TELEGRAM_WEBAPP_URL }}

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Validate required environment
        shell: bash
        run: |
          missing=()
          for var in TELEGRAM_API_ID TELEGRAM_API_HASH BOT_USERNAME OXPLAYER_API_BASE_URL OXPLAYER_TELEGRAM_WEBAPP_SHORT_NAME OXPLAYER_TELEGRAM_WEBAPP_URL; do
            [ -z "${!var}" ] && missing+=("$var")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required secrets/variables: ${missing[*]}"
            exit 1
          fi

      - name: Generate dart-defines file
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP']) / 'flutter-build-env.json'
          out.write_text(json.dumps({
              'TELEGRAM_API_ID':                    os.environ.get('TELEGRAM_API_ID', ''),
              'TELEGRAM_API_HASH':                  os.environ.get('TELEGRAM_API_HASH', ''),
              'BOT_USERNAME':                       os.environ.get('BOT_USERNAME', ''),
              'OXPLAYER_API_BASE_URL':               os.environ.get('OXPLAYER_API_BASE_URL', ''),
              'OXPLAYER_TELEGRAM_WEBAPP_SHORT_NAME': os.environ.get('OXPLAYER_TELEGRAM_WEBAPP_SHORT_NAME', ''),
              'OXPLAYER_TELEGRAM_WEBAPP_URL':        os.environ.get('OXPLAYER_TELEGRAM_WEBAPP_URL', ''),
          }), encoding='utf-8')
          PY
          echo "FLUTTER_BUILD_ENV_FILE=$RUNNER_TEMP/flutter-build-env.json" >> "$GITHUB_ENV"

      - name: Configure Android signing
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "Signing secrets incomplete — falling back to debug signing."
            exit 0
          fi

          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

          cat > android/app/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOF

          # Validate keystore is readable
          if ! keytool -list -keystore android/app/keystore.jks \
               -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
               -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
               -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" >/dev/null 2>&1; then
            echo "Keystore validation failed — falling back to debug signing."
            rm -f android/app/keystore.jks android/app/key.properties
          fi

      - name: Build Android APKs (split per ABI)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --flavor production \
            --build-name=${{ env.OXPLAYER_VERSION_NAME }} \
            --build-number=${{ github.run_number }} \
            --dart-define-from-file="$FLUTTER_BUILD_ENV_FILE"

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/keystore.jks android/app/key.properties

      - name: Collect APK artifacts
        run: |
          mkdir -p release-apks
          APK_DIR=build/app/outputs/flutter-apk
          cp "$APK_DIR/app-arm64-v8a-production-release.apk"   release-apks/OXPlayer-arm64-v8a.apk
          cp "$APK_DIR/app-armeabi-v7a-production-release.apk" release-apks/OXPlayer-armeabi-v7a.apk
          cp "$APK_DIR/app-x86_64-production-release.apk"      release-apks/OXPlayer-x86_64.apk

      - name: Attest APKs
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-apks/OXPlayer-arm64-v8a.apk
            release-apks/OXPlayer-armeabi-v7a.apk
            release-apks/OXPlayer-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.OXPLAYER_VERSION_NAME }}
          name: OXPlayer ${{ env.OXPLAYER_VERSION_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-apks/OXPlayer-arm64-v8a.apk
            release-apks/OXPlayer-armeabi-v7a.apk
            release-apks/OXPlayer-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
