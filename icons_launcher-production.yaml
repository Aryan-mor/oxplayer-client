icons_launcher:
  image_path: "icons/production/oxplayer_icon.png"
  platforms:
    android:
      # Launcher mipmaps + adaptive XML come from Icon Kitchen (see refs/IconKitchen-Output).
      # After changing icons in Kitchen, copy android/res + play_store_512 into this project again.
      enable: false
    ios:
      enable: false
    windows:
      image_path: "icons/production/oxplayer_icon_desktop.png"
      enable: true
    macos:
      image_path: "icons/production/oxplayer_macos_icon.png"
      enable: true
    linux:
      image_path: "icons/production/oxplayer_icon_desktop.png"
      enable: true
    web:
      # Web icons come from Icon Kitchen (web/icons + favicon.png).
      enable: false
